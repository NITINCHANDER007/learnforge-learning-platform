services:
  - type: web
    name: learnforge-learning-platform
    env: node
    plan: free
    buildCommand: npm --prefix server install --production=false && npm --prefix client install --production=false && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CONTENT_DIR
        value: ../content
      - key: UPLOADS_DIR
        value: ../uploads
