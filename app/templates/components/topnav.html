<a href="{{ url_for('main.home') }}" class="topnav__brand">LearnForge</a>

<form action="{{ url_for('main.search') }}" method="GET" class="topnav__search" role="search" id="navbar-search-form">
    <svg class="topnav__search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input type="text" name="q" id="global-search-input" placeholder="Search... (/)" autocomplete="off" aria-label="Search lessons" aria-autocomplete="list" aria-controls="search-dropdown-menu">
    <div id="search-dropdown-menu" class="search-dropdown" style="display: none;" role="listbox"></div>
</form>

<nav class="topnav__subjects" aria-label="Subjects">
    {% for subject in subjects %}
        <a href="{{ url_for('main.view_subject', subject_slug=subject.slug) }}"
           class="topnav__link{% if subject.slug == current_subject %} topnav__link--active{% endif %}"
           {% if subject.slug == current_subject %}aria-current="page"{% endif %}>
            {{ subject.title }}
        </a>
    {% endfor %}
</nav>

<div class="topnav__auth">
    <a href="{{ url_for('main.playground') }}" class="topnav__auth-link" title="Interactive Code Playground">⚡ Playground</a>
    <button type="button" id="theme-toggle" class="topnav__theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        🌓
    </button>
    {% if current_user.is_authenticated %}
        {% if current_user.is_admin %}
            <a href="{{ url_for('admin.dashboard') }}" class="topnav__auth-link">Admin</a>
        {% endif %}
        <a href="{{ url_for('dashboard.home') }}" class="topnav__auth-link">Dashboard</a>
        <a href="{{ url_for('auth.logout') }}" class="topnav__auth-link">Log Out</a>
        <a href="{{ url_for('dashboard.profile') }}" class="topnav__avatar" title="{{ current_user.name }}">
            {{ current_user.name[0] | upper }}
        </a>
    {% else %}
        <a href="{{ url_for('auth.login') }}" class="topnav__auth-link">Log In</a>
        <a href="{{ url_for('auth.register') }}" class="topnav__auth-link topnav__auth-link--cta">Sign Up</a>
    {% endif %}
</div>
