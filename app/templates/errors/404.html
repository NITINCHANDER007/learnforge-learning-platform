{% extends "base.html" %}
{% block title %}404 Not Found · DataDrix{% endblock %}
{% block content %}
<div class="content__body" style="text-align: center; padding: var(--space-8) var(--space-4); max-width: 600px; margin: 0 auto;">
    <div style="font-size: 64px; font-weight: 700; color: var(--color-primary); margin-bottom: var(--space-2);">404</div>
    <h1 class="lesson__title" style="font-size: 28px; margin-bottom: var(--space-3);">Page Not Found</h1>
    <p style="color: var(--color-text-secondary); margin-bottom: var(--space-6); font-size: 16px;">
        The lesson, subject, or page you were looking for doesn't exist or may have been moved.
    </p>
    <div style="display: flex; gap: var(--space-3); justify-content: center;">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary">Return Home</a>
        <a href="{{ url_for('main.search') }}" class="btn btn-secondary">Search Lessons</a>
    </div>
</div>
{% endblock %}
